repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: true

      - id: mypy
        name: mypy (type check)
        entry: uv run --directory backend mypy
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false